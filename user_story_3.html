<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCompare - Multi-Destination Flight Search</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #0f172a;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --accent: #0ea5e9;
            --success: #059669;
            --danger: #e11d48;
            --danger-bg: #fff1f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            padding: 48px 24px 80px;
            text-align: center;
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        .hero p {
            color: #94a3b8;
            font-size: 1rem;
        }

        .container {
            max-width: 960px;
            margin: -50px auto 0;
            padding: 0 20px;
        }

        .search-card {
            background: var(--card);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
            margin-bottom: 32px;
        }

        .grid-top {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 640px) {
            .grid-top { grid-template-columns: 1fr; }
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        select, input[type="date"] {
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            background: #f8fafc;
            transition: all 0.2s;
            outline: none;
        }

        select:focus, input[type="date"]:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .dest-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }

        .pill-checkbox {
            display: none;
        }

        .pill-label {
            padding: 10px 16px;
            border: 1.5px solid var(--border);
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #f8fafc;
            color: var(--muted);
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pill-checkbox:checked + .pill-label {
            background: #eff6ff;
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            margin-top: 24px;
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .dest-section {
            background: var(--card);
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .dest-banner {
            background: #f8fafc;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dest-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: #dbeafe;
            color: var(--primary);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 700;
        }

        .flight-card {
            display: grid;
            grid-template-columns: 2fr 2fr 1.5fr;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        .flight-card:last-child {
            border-bottom: none;
        }

        .flight-card:hover {
            background: #f8fafc;
        }

        @media (max-width: 640px) {
            .flight-card {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        .airline-box {
            display: flex;
            flex-direction: column;
        }

        .airline-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
        }

        .flight-code {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .time-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-point {
            text-align: center;
        }

        .time-val {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .airport-code {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 600;
        }

        .route-line {
            flex: 1;
            height: 2px;
            background: var(--border);
            position: relative;
            max-width: 80px;
        }

        .route-line::after {
            content: '✈';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: var(--accent);
        }

        .price-box {
            text-align: right;
        }

        @media (max-width: 640px) {
            .price-box { text-align: left; }
        }

        .price-val {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--success);
        }

        .price-sub {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .empty-state {
            padding: 28px 20px;
            text-align: center;
            background: var(--danger-bg);
            color: var(--danger);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .initial-state {
            text-align: center;
            padding: 48px 20px;
            background: var(--card);
            border-radius: 14px;
            border: 1px dashed var(--border);
            color: var(--muted);
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>SkyCompare Multi-Flight</h1>
        <p>Bandingkan jadwal maskapai dan harga tiket ke berbagai kota tujuan sekaligus</p>
    </div>

    <div class="container">
        <div class="search-card">
            <form id="flightSearchForm">
                <div class="grid-top">
                    <div class="field-group">
                        <label class="field-label" for="originSelect">Bandara Asal</label>
                        <select id="originSelect" required>
                            <option value="CGK">Jakarta (CGK) - Soekarno-Hatta</option>
                            <option value="SUB">Surabaya (SUB) - Juanda</option>
                            <option value="DPS">Denpasar (DPS) - Ngurah Rai</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="dateInput">Tanggal Keberangkatan</label>
                        <input type="date" id="dateInput" required>
                    </div>
                </div>

                <div class="field-group">
                    <span class="field-label">Pilih Tujuan Penerbangan (Bisa lebih dari 1 kota)</span>
                    <div class="dest-pills">
                        <input type="checkbox" id="dest-dps" class="pill-checkbox" value="DPS" checked>
                        <label for="dest-dps" class="pill-label">Bali (DPS)</label>

                        <input type="checkbox" id="dest-sub" class="pill-checkbox" value="SUB" checked>
                        <label for="dest-sub" class="pill-label">Surabaya (SUB)</label>

                        <input type="checkbox" id="dest-yia" class="pill-checkbox" value="YIA">
                        <label for="dest-yia" class="pill-label">Yogyakarta (YIA)</label>

                        <input type="checkbox" id="dest-kno" class="pill-checkbox" value="KNO">
                        <label for="dest-kno" class="pill-label">Medan (KNO)</label>

                        <input type="checkbox" id="dest-upg" class="pill-checkbox" value="UPG">
                        <label for="dest-upg" class="pill-label">Makassar (UPG)</label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Cari & Bandingkan Penerbangan</button>
            </form>
        </div>

        <div id="resultsArea">
            <div class="initial-state">
                Pilih bandara asal, tanggal keberangkatan, dan centang beberapa kota tujuan di atas untuk membandingkan jadwal penerbangan.
            </div>
        </div>
    </div>

    <script>
        const cityNames = {
            CGK: 'Jakarta (CGK)',
            SUB: 'Surabaya (SUB)',
            DPS: 'Bali (DPS)',
            YIA: 'Yogyakarta (YIA)',
            KNO: 'Medan (KNO)',
            UPG: 'Makassar (UPG)'
        };

        const mockSchedules = [
            { origin: 'CGK', dest: 'DPS', airline: 'Garuda Indonesia', code: 'GA-402', dep: '07:15', arr: '10:05', price: 1350000 },
            { origin: 'CGK', dest: 'DPS', airline: 'Citilink', code: 'QG-680', dep: '11:30', arr: '14:20', price: 780000 },
            { origin: 'CGK', dest: 'DPS', airline: 'AirAsia Indonesia', code: 'QZ-751', dep: '16:45', arr: '19:35', price: 690000 },
            { origin: 'CGK', dest: 'SUB', airline: 'Batik Air', code: 'ID-6570', dep: '08:00', arr: '09:30', price: 890000 },
            { origin: 'CGK', dest: 'SUB', airline: 'Lion Air', code: 'JT-592', dep: '14:15', arr: '15:45', price: 620000 },
            { origin: 'CGK', dest: 'YIA', airline: 'Garuda Indonesia', code: 'GA-204', dep: '09:20', arr: '10:35', price: 950000 },
            { origin: 'SUB', dest: 'DPS', airline: 'Citilink', code: 'QG-662', dep: '10:10', arr: '11:05', price: 510000 },
            { origin: 'SUB', dest: 'KNO', airline: 'Lion Air', code: 'JT-972', dep: '12:00', arr: '16:15', price: 1450000 },
            { origin: 'DPS', dest: 'CGK', airline: 'Garuda Indonesia', code: 'GA-411', dep: '15:00', arr: '15:50', price: 1320000 }
        ];

        document.getElementById('dateInput').valueAsDate = new Date();

        function formatRupiah(num) {
            return 'Rp ' + num.toLocaleString('id-ID');
        }

        document.getElementById('flightSearchForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const origin = document.getElementById('originSelect').value;
            const dateVal = document.getElementById('dateInput').value;
            const checkedBoxes = document.querySelectorAll('.pill-checkbox:checked');
            const selectedDests = Array.from(checkedBoxes).map(cb => cb.value);

            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = '';

            if (selectedDests.length === 0) {
                alert('Pilih minimal satu kota tujuan terlebih dahulu!');
                return;
            }

            const isBlackoutDate = dateVal.endsWith('-31');

            selectedDests.forEach(dest => {
                const section = document.createElement('div');
                section.className = 'dest-section';

                const matches = isBlackoutDate
                    ? []
                    : mockSchedules.filter(item => item.origin === origin && item.dest === dest);

                const banner = document.createElement('div');
                banner.className = 'dest-banner';
                banner.innerHTML = `
                    <div class="dest-title">
                        <span>${cityNames[origin]} ➔ ${cityNames[dest]}</span>
                    </div>
                    <span class="badge">${dateVal} • ${matches.length} Penerbangan</span>
                `;
                section.appendChild(banner);

                if (matches.length > 0) {
                    matches.forEach(flight => {
                        const card = document.createElement('div');
                        card.className = 'flight-card';
                        card.innerHTML = `
                            <div class="airline-box">
                                <span class="airline-name">${flight.airline}</span>
                                <span class="flight-code">Kode: ${flight.code}</span>
                            </div>
                            <div class="time-box">
                                <div class="time-point">
                                    <div class="time-val">${flight.dep}</div>
                                    <div class="airport-code">${flight.origin}</div>
                                </div>
                                <div class="route-line"></div>
                                <div class="time-point">
                                    <div class="time-val">${flight.arr}</div>
                                    <div class="airport-code">${flight.dest}</div>
                                </div>
                            </div>
                            <div class="price-box">
                                <div class="price-val">${formatRupiah(flight.price)}</div>
                                <div class="price-sub">/ orang</div>
                            </div>
                        `;
                        section.appendChild(card);
                    });
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.textContent = 'Jadwal penerbangan untuk tujuan tersebut tidak tersedia';
                    section.appendChild(empty);
                }

                resultsArea.appendChild(section);
            });
        });
    </script>
</body>
</html>
